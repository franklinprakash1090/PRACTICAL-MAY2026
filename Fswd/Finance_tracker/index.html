<!DOCTYPE html> 
<html> 
<head> 
    <title>Personal Finance Tracker</title> 
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script> 
    <style> 
        body { 
            font-family: Arial; 
            background-color: #f4f6f8; 
            padding: 20px; 
        } 
        h1 { 
            text-align: center; 
        } 
        form { 
            background: white; 
            padding: 15px; 
            border-radius: 5px; 
            width: 50%; 
            margin: auto; 
        } 
        input, select { 
            width: 100%; 
            padding: 8px; 
            margin: 5px 0; 
        } 
        button { 
            padding: 10px; 
            background-color: #2c3e50; 
            color: white; 
            border: none; 
            cursor: pointer; 
        } 
        table { 
            width: 80%; 
            margin: 20px auto; 
            border-collapse: collapse; 
            background: white; 
        } 
        th, td { 
            padding: 10px; 
            border: 1px solid #ddd; 
            text-align: center; 
        } 
        canvas { 
            width: 50% !important; 
            margin: 20px auto; 
            display: block; 
        } 
    </style> 
</head> 
<body> 
<h1>Personal Finance Tracker</h1> 
<form id="financeForm"> 
    <label>Type:</label> 
    <select id="type"> 
        <option value="Income">Income</option> 
        <option value="Expense">Expense</option> 
    </select> 
    <label>Amount:</label> 
    <input type="number" id="amount" required> 
    <label>Category:</label> 
    <input type="text" id="category" placeholder="e.g., Food, Salary" required> 
    <label>Date:</label> 
    <input type="date" id="date" required> 
    <button type="submit">Add Transaction</button> 
</form> 
<h2 style="text-align:center;">Transaction History</h2> 
<table> 
    <thead> 
        <tr> 
            <th>Type</th> 
            <th>Amount</th> 
            <th>Category</th> 
            <th>Date</th> 
        </tr> 
    </thead> 
    <tbody id="transactionTable"></tbody> 
</table> 
<h2 style="text-align:center;">Financial Overview</h2> 
<canvas id="financeChart"></canvas> 
<script> 
    let transactions = []; 
    let totalIncome = 0; 
    let totalExpense = 0; 
    const ctx = document.getElementById('financeChart').getContext('2d'); 
    const financeChart = new Chart(ctx, { 
        type: 'pie', 
        data: { 
            labels: ['Income', 'Expense'], 
            datasets: [{ 
                data: [0, 0], 
                backgroundColor: ['#27ae60', '#e74c3c'] 
            }] 
        } 
    }); 
    document.getElementById('financeForm').addEventListener('submit', 
function(e) { 
        e.preventDefault(); 
        let type = document.getElementById('type').value; 
        let amount = parseFloat(document.getElementById('amount').value); 
        let category = document.getElementById('category').value; 
        let date = document.getElementById('date').value; 
        transactions.push({ type, amount, category, date }); 
        if (type === "Income") { 
            totalIncome += amount; 
        } else { 
            totalExpense += amount; 
        } 
        updateTable(type, amount, category, date); 
        updateChart(); 
        this.reset(); 
    }); 
    function updateTable(type, amount, category, date) { 
        let table = document.getElementById('transactionTable'); 
        let row = table.insertRow(); 
        row.insertCell(0).innerHTML = type; 
        row.insertCell(1).innerHTML = amount; 
        row.insertCell(2).innerHTML = category; 
        row.insertCell(3).innerHTML = date; 
    } 
    function updateChart() { 
        financeChart.data.datasets[0].data = [totalIncome, totalExpense]; 
        financeChart.update(); 
    } 
</script> 
</body> 
</html>
