<!DOCTYPE html> 
<html> 
<head> 
    <title>Event Management Platform</title> 
    <style> 
        body { 
            font-family: Arial, sans-serif; 
            background-color: #f4f4f4; 
            margin: 0; 
            padding: 0; 
        } 
        header { 
            background-color: #2c3e50; 
            color: white; 
            text-align: center; 
            padding: 15px; 
        } 
        nav { 

 
            background-color: #34495e; 
            padding: 10px; 
            text-align: center; 
        } 
        nav a { 
            color: white; 
            margin: 15px; 
            text-decoration: none; 
            font-weight: bold; 
        } 
        section { 
            padding: 20px; 
        } 
        .event-card { 
            background: white; 
            padding: 15px; 
            margin: 10px 0; 
            border-radius: 5px; 
            box-shadow: 0 0 5px gray; 
        } 
        form { 
            background: white; 
            padding: 15px; 
            border-radius: 5px; 
            width: 50%; 
        } 
        input, textarea { 
            width: 100%; 
            padding: 8px; 
            margin: 5px 0; 
        } 
        button { 
            background-color: #2c3e50; 
            color: white; 
            padding: 10px; 
            border: none; 
            cursor: pointer; 
        } 
        button:hover { 
            background-color: #1a252f; 
        } 
    </style> 
</head> 
 
<body> 
 
<header> 
    <h1>Event Management Platform</h1> 
</header> 
<nav> 
    <a href="#browse">Browse Events</a> 
    <a href="#register">User Registration</a> 
    <a href="#organizer">Organizer Panel</a> 
</nav> 
<section id="browse"> 
    <h2>Available Events</h2> 
 
    <div class="event-card"> 
        <h3>Tech Conference 2026</h3> 
        <p>Date: March 15, 2026</p> 
        <p>Location: City Hall</p> 
        <button>Register</button> 
    </div> 
    <div class="event-card"> 
        <h3>Music Fest</h3> 
        <p>Date: April 10, 2026</p> 
        <p>Location: Open Ground</p> 
        <button>Register</button> 
    </div> 
</section> 
<section id="register"> 
    <h2>User Event Registration</h2> 
    <form> 
        <label>Full Name:</label> 
        <input type="text" placeholder="Enter your name" required> 
        <label>Email:</label> 
        <input type="email" placeholder="Enter your email" required> 
        <label>Select Event:</label> 
        <input type="text" placeholder="Enter event name" required> 
        <button type="submit">Submit</button> 
    </form> 
</section> 
<section id="organizer"> 
    <h2>Organizer - Create Event</h2> 
    <form> 
        <label>Event Name:</label> 
       <input type="text" placeholder="Enter event name" required> 
        <label>Date:</label> 
        <input type="date" required> 
        <label>Location:</label> 
        <input type="text" placeholder="Enter location" required> 
        <label>Description:</label> 
        <textarea placeholder="Enter event description"></textarea> 
        <button type="submit">Create Event</button> 
    </form> 
</section> 
</body> 
</html>
